[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exprtest"
version = "0.1.0"
description = "Fast symbolic expression predicates with exact, numeric, and heuristic methods."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
keywords = ["symbolic mathematics", "zero testing", "algebraic numbers", "interval arithmetic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
]

[project.optional-dependencies]
flint = ["python-flint>=0.5"]
test = ["pytest>=7.0", "pytest-cov>=4.1"]
docs = []
release = ["build>=1.2", "twine>=5.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.1", "python-flint>=0.5", "build>=1.2", "twine>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "flint: requires the python-flint rigorous numeric backend",
    "performance_contract: structural performance/refusal contracts with generous CI ceilings",
    "scipy_compat: optional compatibility checks against current SciPy special functions",
]

[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/exprtest"
Repository = "https://github.com/BhuvaneshBhatt/exprtest"
Documentation = "https://github.com/BhuvaneshBhatt/exprtest#readme"
Issues = "https://github.com/BhuvaneshBhatt/exprtest/issues"

[tool.setuptools.package-data]
exprtest = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["exprtest"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"

